<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>게이 던전</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --panel-bg: #1a1a2e;
            --accent-color: #e94560;
            --text-color: #ffffff;
            --gold-color: #ffd700;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 0;
            overflow: hidden;
        }

        @media (min-height: 850px) and (min-width: 480px) {
            #game-container {
                border-radius: 16px;
                height: 90vh;
            }
        }

        header {
            background-color: #16213e;
            padding: 12px 16px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 무지개 타이틀 효과 */
        header h1 {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowGlow 5s linear infinite;
        }

        @keyframes rainbowGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .stage-badge {
            background: var(--accent-color);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        #battle-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #1a1a3a 0%, #0a0a15 100%);
            padding: 10px;
        }

        .monster-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .monster-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .monster-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 15px;
        }

        .monster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
            transition: transform 0.1s;
        }

        .boss-glow {
            border-color: #ff0055;
            box-shadow: 0 0 30px #ff0055, 0 0 50px #ff0055;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .bar-container {
            width: 80%;
            height: 16px;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 6px;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
        }

        .hp-fill { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
        .player-hp-fill { background: linear-gradient(90deg, #11998e, #38ef7d); }
        .exp-fill { background: linear-gradient(90deg, #2193b0, #6dd5ed); }

        .bar-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.7rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        #stats-panel {
            background-color: #16213e;
            padding: 10px 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-top: 1px solid #0f3460;
        }

        .stat-item {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-label { color: #aaa; }
        .stat-val { font-weight: bold; }

        #action-panel {
            padding: 12px;
            background-color: #0f172a;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #1f4068, #16213e);
            color: white;
            border: 1px solid #0f3460;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: active 0.1s, background 0.2s;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        .btn-attack {
            grid-column: span 2;
            background: linear-gradient(135deg, #e94560, #950740);
            border: none;
            font-size: 1.1rem;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.4);
        }

        .btn-skill {
            background: linear-gradient(135deg, #8a2be2, #4a00e0);
        }

        .btn-shop {
            background: linear-gradient(135deg, #f39c12, #d35400);
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title {
            text-align: center;
            font-size: 1.2rem;
            color: var(--gold-color);
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            padding: 10px;
            border-radius: 8px;
        }

        .shop-item-info div:first-child { font-weight: bold; font-size: 0.9rem; }
        .shop-item-info div:last-child { font-size: 0.75rem; color: #aaa; }

        .btn-buy {
            background: var(--gold-color);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .btn-close {
            background: #444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .hit-effect {
            animation: shake 0.2s ease-in-out;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 0); }
            40% { transform: translate(10px, 0); }
            60% { transform: translate(-5px, 0); }
            80% { transform: translate(5px, 0); }
            100% { transform: translate(0, 0); }
        }

        .damage-pop {
            position: absolute;
            font-weight: bold;
            font-size: 1.8rem;
            color: #ff3333;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }

        .damage-pop.crit {
            color: #ffcc00;
            font-size: 2.3rem;
        }

        .damage-pop.heal {
            color: #33ff33;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }

        #overlay-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #overlay-screen h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #log-panel {
            height: 60px;
            width: 100%;
            background-color: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.75rem;
            overflow-y: auto;
            color: #ddd;
            display: flex;
            flex-direction: column-reverse;
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1>게이 던전</h1>
        <div class="stage-badge" id="stage-display">STAGE 1</div>
    </header>

    <div id="battle-screen">
        <div class="monster-container">
            <div class="monster-name" id="monster-name">게이</div>
            <div class="monster-wrapper" id="monster-wrapper">
                <img id="monster-img" class="monster-img" src="./mob1.png" alt="몬스터">
            </div>
            <div class="bar-container">
                <div class="bar-fill hp-fill" id="monster-hp-bar"></div>
                <div class="bar-text" id="monster-hp-text">60 / 60</div>
            </div>
        </div>

        <div id="log-panel"></div>
    </div>

    <div id="stats-panel">
        <div class="stat-item">
            <span class="stat-label">❤️ 체력</span>
            <div style="width: 60%; position: relative;">
                <div class="bar-container" style="margin: 0; width: 100%;">
                    <div class="bar-fill player-hp-fill" id="player-hp-bar"></div>
                    <div class="bar-text" id="player-hp-text">100 / 100</div>
                </div>
            </div>
        </div>
        <div class="stat-item">
            <span class="stat-label">⭐ 레벨</span>
            <span class="stat-val" id="player-level">Lv.1</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">⚔️ 공격력</span>
            <span class="stat-val" id="player-atk">12</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">💰 골드</span>
            <span class="stat-val" style="color: var(--gold-color);" id="player-gold">0 G</span>
        </div>
        <div class="stat-item" style="grid-column: span 2;">
            <span class="stat-label">✨ 경험치</span>
            <div style="width: 75%; position: relative;">
                <div class="bar-container" style="margin: 0; width: 100%;">
                    <div class="bar-fill exp-fill" id="player-exp-bar"></div>
                    <div class="bar-text" id="player-exp-text">0 / 30</div>
                </div>
            </div>
        </div>
    </div>

    <div id="action-panel">
        <button class="btn btn-attack" onclick="playerAttack()">⚔️ 공격하기</button>
        <button class="btn btn-skill" onclick="useSkill()">⚡ 필살기 (MP:20)</button>
        <button class="btn btn-shop" onclick="openShop()">🛒 상점</button>
    </div>

    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <div class="modal-title">🛒 모험가 상점</div>
            <div id="shop-items"></div>
            <button class="btn btn-close" onclick="closeShop()">닫기</button>
        </div>
    </div>

    <div id="overlay-screen">
        <h2 id="overlay-title" style="color: red;">GAME OVER</h2>
        <p id="overlay-msg" style="margin-bottom: 20px; color: #ccc;">체력이 바닥났습니다...</p>
        <button class="btn btn-attack" onclick="resetGame()" style="grid-column: auto; width: 80%;">처음부터 다시하기</button>
    </div>
</div>

<script>
    const monsters = [
        { name: "게이", hp: 60, maxHp: 60, atk: 8, exp: 30, gold: 30, image: "./mob1.png" },
        { name: "슈퍼 게이", hp: 160, maxHp: 160, atk: 18, exp: 70, gold: 90, image: "./mob2.png" },
        { name: "울트라 게이", hp: 400, maxHp: 400, atk: 30, exp: 200, gold: 250, image: "./mob3.png" }
    ];

    let currentStage = 0;
    let monsterCurrentHp = monsters[0].hp;

    let player = {
        level: 1,
        hp: 100,
        maxHp: 100,
        atk: 12,
        exp: 0,
        maxExp: 30,
        gold: 0,
        mp: 100,
        maxMp: 100,
        weaponBonus: 0
    };

    const shopItems = [
        { id: 1, name: "체력 포션", desc: "체력 50 회복", price: 20, type: "potion", val: 50 },
        { id: 2, name: "고급 포션", desc: "체력 150 회복", price: 50, type: "potion", val: 150 },
        { id: 3, name: "강철 검", desc: "공격력 +5", price: 40, type: "weapon", val: 5 },
        { id: 4, name: "화염의 검", desc: "공격력 +15", price: 100, type: "weapon", val: 15 },
        { id: 5, name: "전설의 성검", desc: "공격력 +35", price: 250, type: "weapon", val: 35 }
    ];

    function initGame() {
        updateUI();
        renderShop();
        log("게이 던전에 입장했습니다! 몹을 처치하세요.");
    }

    function updateUI() {
        const m = monsters[currentStage];
        document.getElementById("stage-display").innerText = `STAGE ${currentStage + 1}`;
        document.getElementById("monster-name").innerText = m.name;
        document.getElementById("monster-img").src = m.image;
        
        const mImg = document.getElementById("monster-img");
        if(currentStage === 2) {
            mImg.classList.add("boss-glow");
        } else {
            mImg.classList.remove("boss-glow");
        }

        const mHpPct = Math.max(0, (monsterCurrentHp / m.maxHp) * 100);
        document.getElementById("monster-hp-bar").style.width = `${mHpPct}%`;
        document.getElementById("monster-hp-text").innerText = `${Math.max(0, monsterCurrentHp)} / ${m.maxHp}`;

        const pHpPct = Math.max(0, (player.hp / player.maxHp) * 100);
        document.getElementById("player-hp-bar").style.width = `${pHpPct}%`;
        document.getElementById("player-hp-text").innerText = `${Math.max(0, player.hp)} / ${player.maxHp}`;

        const pExpPct = (player.exp / player.maxExp) * 100;
        document.getElementById("player-exp-bar").style.width = `${pExpPct}%`;
        document.getElementById("player-exp-text").innerText = `${player.exp} / ${player.maxExp}`;

        document.getElementById("player-level").innerText = `Lv.${player.level}`;
        document.getElementById("player-atk").innerText = player.atk + player.weaponBonus;
        document.getElementById("player-gold").innerText = `${player.gold} G`;
    }

    function log(msg) {
        const panel = document.getElementById("log-panel");
        const div = document.createElement("div");
        div.innerText = `> ${msg}`;
        panel.prepend(div);
    }

    function createPopText(text, isCrit = false, isHeal = false) {
        const screen = document.getElementById("battle-screen");
        const pop = document.createElement("div");
        pop.className = `damage-pop ${isCrit ? 'crit' : ''} ${isHeal ? 'heal' : ''}`;
        pop.innerText = text;
        
        const randomX = Math.random() * 80 - 40;
        pop.style.left = `calc(50% + ${randomX}px)`;
        pop.style.top = `40%`;
        
        screen.appendChild(pop);
        setTimeout(() => pop.remove(), 800);
    }

    function playerAttack() {
        const m = monsters[currentStage];
        const isCrit = Math.random() < 0.25;
        const baseAtk = player.atk + player.weaponBonus;
        let dmg = Math.floor(baseAtk * (0.9 + Math.random() * 0.2));
        if (isCrit) dmg = Math.floor(dmg * 1.8);

        monsterCurrentHp -= dmg;
        createPopText(isCrit ? `💥 크리티컬! -${dmg}` : `-${dmg}`, isCrit);
        
        const wrapper = document.getElementById("monster-wrapper");
        wrapper.classList.remove("hit-effect");
        void wrapper.offsetWidth; 
        wrapper.classList.add("hit-effect");

        log(`${m.name}에게 ${dmg}의 피해를 입혔습니다!`);

        if (monsterCurrentHp <= 0) {
            monsterCurrentHp = 0;
            updateUI();
            setTimeout(defeatMonster, 300);
        } else {
            updateUI();
            setTimeout(monsterAttack, 500);
        }
    }

    function useSkill() {
        if (player.mp < 20) {
            log("마나가 부족합니다!");
            return;
        }
        player.mp -= 20;
        const m = monsters[currentStage];
        const baseAtk = player.atk + player.weaponBonus;
        let dmg = Math.floor(baseAtk * 2.3);

        monsterCurrentHp -= dmg;
        createPopText(`⚡ 필살기! -${dmg}`, true);

        const screen = document.getElementById("battle-screen");
        screen.classList.remove("hit-effect");
        void screen.offsetWidth;
        screen.classList.add("hit-effect");

        log(`강력한 필살기로 ${m.name}에게 ${dmg}의 피해!`);

        if (monsterCurrentHp <= 0) {
            monsterCurrentHp = 0;
            updateUI();
            setTimeout(defeatMonster, 300);
        } else {
            updateUI();
            setTimeout(monsterAttack, 500);
        }
    }

    function monsterAttack() {
        const m = monsters[currentStage];
        let dmg = Math.floor(m.atk * (0.85 + Math.random() * 0.3));
        
        player.hp -= dmg;
        
        const container = document.getElementById("game-container");
        container.classList.remove("hit-effect");
        void container.offsetWidth;
        container.classList.add("hit-effect");

        log(`${m.name}의 공격! ${dmg}의 피해를 입었습니다.`);

        if (player.hp <= 0) {
            player.hp = 0;
            updateUI();
            showGameOver(false);
        } else {
            updateUI();
        }
    }

    function defeatMonster() {
        const m = monsters[currentStage];
        log(`🎉 ${m.name}을(를) 처치했습니다! (+${m.gold}G, +${m.exp}EXP)`);
        
        player.gold += m.gold;
        gainExp(m.exp);

        if (currentStage < monsters.length - 1) {
            currentStage++;
            monsterCurrentHp = monsters[currentStage].hp;
            log(`➡️ STAGE ${currentStage + 1} : ${monsters[currentStage].name} 등장!`);
            updateUI();
        } else {
            showGameOver(true);
        }
    }

    function gainExp(amount) {
        player.exp += amount;
        if (player.exp >= player.maxExp) {
            player.exp -= player.maxExp;
            player.level++;
            player.maxHp += 20;
            player.hp = player.maxHp;
            player.atk += 4;
            player.maxExp = Math.floor(player.maxExp * 1.5);
            log(`✨ 레벨 업! Lv.${player.level}가 되었습니다. (체력/공격력 증가)`);
        }
    }

    function renderShop() {
        const container = document.getElementById("shop-items");
        container.innerHTML = "";
        shopItems.forEach(item => {
            const div = document.createElement("div");
            div.className = "shop-item";
            div.innerHTML = `
                <div class="shop-item-info">
                    <div>${item.name}</div>
                    <div>${item.desc}</div>
                </div>
                <button class="btn-buy" onclick="buyItem(${item.id})">${item.price} G</button>
            `;
            container.appendChild(div);
        });
    }

    function openShop() {
        document.getElementById("shop-modal").style.display = "flex";
    }

    function closeShop() {
        document.getElementById("shop-modal").style.display = "none";
    }

    function buyItem(id) {
        const item = shopItems.find(i => i.id === id);
        if (!item) return;

        if (player.gold < item.price) {
            alert("골드가 부족합니다!");
            return;
        }

        player.gold -= item.price;

        if (item.type === "potion") {
            player.hp = Math.min(player.maxHp, player.hp + item.val);
            createPopText(`+${item.val} HP`, false, true);
            log(`${item.name}을 사용해 체력을 회복했습니다.`);
        } else if (item.type === "weapon") {
            player.weaponBonus += item.val;
            log(`${item.name}을 구매하여 공격력이 ${item.val} 증가했습니다!`);
        }

        updateUI();
    }

    function showGameOver(isWin) {
        const overlay = document.getElementById("overlay-screen");
        const title = document.getElementById("overlay-title");
        const msg = document.getElementById("overlay-msg");

        if (isWin) {
            title.innerText = "🏆 게이 던전 클리어!";
            title.style.color = "#ffd700";
            msg.innerText = "축하합니다! 모든 몹을 물리치고 게이 던전을 제패하셨습니다!";
        } else {
            title.innerText = "GAME OVER";
            title.style.color = "#ff416c";
            msg.innerText = "체력이 모두 소진되었습니다. 다시 도전해보세요!";
        }

        overlay.style.display = "flex";
    }

    function resetGame() {
        currentStage = 0;
        monsterCurrentHp = monsters[0].hp;
        player = {
            level: 1,
            hp: 100,
            maxHp: 100,
            atk: 12,
            exp: 0,
            maxExp: 30,
            gold: 0,
            mp: 100,
            maxMp: 100,
            weaponBonus: 0
        };
        document.getElementById("overlay-screen").style.display = "none";
        document.getElementById("log-panel").innerHTML = "";
        initGame();
    }

    initGame();
</script>
</body>
</html>
